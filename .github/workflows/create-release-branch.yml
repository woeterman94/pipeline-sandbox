name: Create Release Branch

on:
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Name of the release branch (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Abort if not run from main branch
        if: ${{ github.ref_name != 'main' }}
        run: |
          echo "❌ This workflow can only be manually triggered from the 'main' branch."
          exit 1
          
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
  
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }} #checkout the repo with the token from the app
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push release branch
        run: |
          BRANCH_NAME="${{ github.event.inputs.branch_name }}"
          echo "Creating release branch: $BRANCH_NAME"
          git checkout -b "release/$BRANCH_NAME"
          git push origin "release/$BRANCH_NAME"
          echo "✅ Branch 'release/$BRANCH_NAME' created from main"
